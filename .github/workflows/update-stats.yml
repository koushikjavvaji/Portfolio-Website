name: Update ratings
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-stats.mjs
      - name: Commit if changed
        run: |
          git diff --quiet public/stats.json && exit 0
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add public/stats.json
          git commit -m "chore: update ratings"
          git push
